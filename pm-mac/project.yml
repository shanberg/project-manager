name: PM
options:
  bundleIdPrefix: com.stuarthanberg
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

packages:
  PmLib:
    # Local Swift package holding the shared domain logic (config, notes, todos, focus).
    path: ../pm-swift

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Kept in sync with package.json by scripts/release.sh, and overridden on the command line by
    # scripts/build-app-dist.sh. The Info.plist reads it through $(MARKETING_VERSION) below — without
    # that indirection XcodeGen writes its own default and the bundle version drifts from the release.
    MARKETING_VERSION: "0.28.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 9626CTDMM9
    # Don't let Xcode inject get-task-allow=true (the debuggable flag). TCC can refuse to honor a
    # Full Disk Access grant for a debuggable app, which manifests as the folder access hanging then
    # being denied even though the app is listed in FDA.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  configs:
    Debug:
      # Local dev: sign with the Apple Development identity (not ad-hoc). Gives a stable, identifier-
      # based designated requirement so macOS TCC grants (Documents / Full Disk Access) persist across
      # rebuilds — an ad-hoc "-" signature uses a per-build cdhash that TCC can't durably record.
      # Hardened runtime stays off locally: it isn't needed and keeps debug attach simple.
      CODE_SIGN_IDENTITY: "Apple Development: Stuart Hanberg (L4L7G83F22)"
      ENABLE_HARDENED_RUNTIME: false
    Release:
      # Distribution: Developer ID Application + hardened runtime. Apple notarization requires both,
      # and notarization is what lets consumers open the app without Gatekeeper blocking it.
      CODE_SIGN_IDENTITY: "Developer ID Application: Stuart Hanberg (9626CTDMM9)"
      ENABLE_HARDENED_RUNTIME: true

targets:
  PM:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: PM
    dependencies:
      - package: PmLib
        product: PmLib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stuarthanberg.pm
        PRODUCT_NAME: PM
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PM/Info.plist
      properties:
        CFBundleName: PM
        CFBundleDisplayName: PM
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Derived, not restated: the app is built for deploymentTarget above and won't launch below
        # it, but this key is what LaunchServices and Gatekeeper read. Hardcoded, it said 13.0 while
        # the target was 26.0 — the cask's `depends_on macos:` covers Homebrew users, but anyone
        # taking the zip straight from the GitHub release got told it runs on Ventura.
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Custom URL scheme so Raycast (and other launchers) can drive the app:
        # pmpanel://toggle | show | hide | pin?on=… | float?on=…
        CFBundleURLTypes:
          - CFBundleURLName: com.stuarthanberg.pm
            CFBundleURLSchemes: [pmpanel]
        # The private drag type a task selection carries alongside its public markdown
        # representation, so an in-app reorder can be told apart from a text drag out of another
        # app. See Panel/TaskPasteboard.swift.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.stuarthanberg.pm.task-keys
            UTTypeDescription: PM Task Selection
            UTTypeConformsTo: [public.data]
        # Speakable aliases so Siri can recognize App Shortcut phrases — the bundle name "PM" is a
        # homophone of "p.m." and doesn't work as a spoken trigger. Say e.g. "Show Project Manager
        # panel", "Complete my Project Manager task".
        INAlternativeAppNames:
          - INAlternativeAppName: Project Manager
          - INAlternativeAppName: PM Projects
    scheme:
      testTargets:
        - PMViewTests
    entitlements:
      path: PM/PM.entitlements
      properties:
        # Not sandboxed: needs to read project notes in arbitrary (Full Disk Access) folders,
        # matching the retired Tauri panel's entitlements.
        com.apple.security.app-sandbox: false
        # Explicitly non-debuggable so TCC treats it as a normal app (see CODE_SIGN_INJECT... above).
        com.apple.security.get-task-allow: false

  # The AppKit views, driven with real events and asserted through the layout manager.
  #
  # Hostless on purpose. A unit-test bundle hosted by PM.app would need no stubs and would also launch
  # the app — `applicationDidFinishLaunching` opens windows, reads the projects folder, and can trip a
  # TCC prompt — so running the view tests would touch somebody's real notes. Instead the handful of
  # files under test are compiled straight into the bundle beside `Stubs.swift`, which is what the
  # scratch harness these grew out of did with symlinks.
  #
  # A file added here has to be a file that compiles alone: reach for `PMStore` or `WindowManager` from
  # one of them and this target stops building, which is a useful pressure to have on views.
  PMViewTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: PMViewTests
      - path: PM/Project/MarkdownTextEditor.swift
      - path: PM/Project/MentionPopover.swift
      - path: PM/Project/CompletionController.swift
      - path: PM/Project/TokenLayoutManager.swift
      - path: PM/Task/CompletingTextField.swift
      - path: PM/Task/TokenTextLabel.swift
      - path: PM/QuickBar/ProjectSearch.swift
    dependencies:
      - package: PmLib
        product: PmLib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stuarthanberg.pm.viewtests
        GENERATE_INFOPLIST_FILE: YES
        # Nothing here is signed for distribution and nothing needs an identity; a test bundle picking
        # up the app's Developer ID only slows the build down and fails on a machine without it.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
