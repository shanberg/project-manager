# CodeQL code scanning (advanced setup). Replaces GitHub's default setup, whose Swift job
# ran Xcode's autobuild of pm-mac in Release for both x86_64 and arm64 on every push and
# PR: 30-80 minutes per run, ending in BUILD FAILED, and holding macOS runners that the
# pm-swift check then queued behind.
#
# The Linux languages are cheap and run on every push to main and every PR. The Swift job
# does an explicit Debug `swift build` of pm-swift and runs only when pm-swift changes, plus weekly so new queries still get a pass over unchanged code.
#
# Folio.app (pm-mac) is not built here: it uses SDK API newer than the Xcode on GitHub's
# macOS images (e.g. NSGlassEffectView.effectIsInteractive), so it can't compile there.
# Default setup never got a successful app build either.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Scheduled and manual runs always scan Swift; so does a push with no usable base.
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] \
             || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "swift=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD \
             | grep -qE '^pm-swift/|^\.github/workflows/codeql\.yml$'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, c-cpp]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  analyze-swift:
    name: Analyze (swift)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Build pm-swift (CLI and PmLib)
        working-directory: pm-swift
        run: swift build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
