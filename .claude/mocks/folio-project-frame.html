<title>Folio Project Frame</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a mocked Folio project window with the space's sidebar over its board; each open question is a control in the right column (stacked below on a phone). */
:root {
  --page: #eceef2; --panel: #ffffff; --ink: #1d1f24; --ink-2: #5d6270; --ink-3: #9196a1;
  --rule: #d9dce3; --accent: #2f6fe4; --chip: #eef1f6; --pick: rgba(47,111,228,.14);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --wall-a: #9fb4d6; --wall-b: #d9c6d8; --wall-c: #f1dcc4;
  --glass: rgba(246,247,250,.78); --glass-edge: rgba(255,255,255,.75);
  --shadow: 0 10px 34px rgba(20,24,40,.22), 0 1px 3px rgba(20,24,40,.14);
  --m-ink: #1c1d21; --m-ink-2: rgba(28,29,33,.62); --m-ink-3: rgba(28,29,33,.4);
  --m-rule: rgba(28,29,33,.1); --m-hover: rgba(28,29,33,.06); --m-sel: rgba(255,255,255,.85);
  --m-field: rgba(255,255,255,.6); --win: rgba(255,255,255,.95); --pagebg: #ffffff; --line: #e7e8ec;
  --menu: rgba(250,250,252,.98); --c: #3f7d58;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #17181c; --panel: #212329; --ink: #e9eaee; --ink-2: #a3a7b2; --ink-3: #6f7480; --rule: #33363e;
  --accent: #6b9cff; --chip: #2b2e36; --pick: rgba(107,156,255,.2);
  --wall-a: #1d2944; --wall-b: #3a2742; --wall-c: #4a3326; --glass: rgba(40,41,46,.78); --glass-edge: rgba(255,255,255,.12);
  --shadow: 0 10px 34px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --m-ink: #f2f2f4; --m-ink-2: rgba(242,242,244,.64); --m-ink-3: rgba(242,242,244,.4);
  --m-rule: rgba(255,255,255,.1); --m-hover: rgba(255,255,255,.07); --m-sel: rgba(255,255,255,.14);
  --m-field: rgba(0,0,0,.25); --win: rgba(34,35,40,.96); --pagebg: #1f2025; --line: #2e3036; --menu: rgba(44,45,50,.98);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --page: #17181c; --panel: #212329; --ink: #e9eaee; --ink-2: #a3a7b2; --ink-3: #6f7480; --rule: #33363e;
  --accent: #6b9cff; --chip: #2b2e36; --pick: rgba(107,156,255,.2);
  --wall-a: #1d2944; --wall-b: #3a2742; --wall-c: #4a3326; --glass: rgba(40,41,46,.78); --glass-edge: rgba(255,255,255,.12);
  --shadow: 0 10px 34px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --m-ink: #f2f2f4; --m-ink-2: rgba(242,242,244,.64); --m-ink-3: rgba(242,242,244,.4);
  --m-rule: rgba(255,255,255,.1); --m-hover: rgba(255,255,255,.07); --m-sel: rgba(255,255,255,.14);
  --m-field: rgba(0,0,0,.25); --win: rgba(34,35,40,.96); --pagebg: #1f2025; --line: #2e3036; --menu: rgba(44,45,50,.98);
  color-scheme: dark;
}
body { background: var(--page); color: var(--ink); font-family: var(--ui); }
.wrap { display: grid; grid-template-columns: minmax(0,1fr) 330px; gap: 20px; padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1400px; margin: 0 auto; }
@media (max-width: 980px) { .wrap { grid-template-columns: minmax(0,1fr); } }
h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 12.5px; margin: 0 0 12px; line-height: 1.45; max-width: 80ch; }

.stage { position: relative; border-radius: 12px; overflow: hidden; height: 720px; color: var(--m-ink);
  background: radial-gradient(120% 90% at 10% 0%, var(--wall-a), transparent 60%), radial-gradient(90% 80% at 100% 30%, var(--wall-b), transparent 65%), linear-gradient(160deg, var(--wall-b), var(--wall-c)); }
.win { position: absolute; inset: 18px; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); display: flex;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 18%, var(--win)), color-mix(in srgb, var(--c) 8%, var(--win))); }
.side { width: 248px; flex: none; display: flex; flex-direction: column; min-height: 0; padding: 8px; position: relative; }
.lights { display: flex; gap: 7px; align-items: center; height: 22px; padding-left: 4px; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: var(--m-rule); }
.lights .grow { flex: 1; }
.ib { width: 24px; height: 22px; border: 0; background: none; border-radius: 6px; display: grid; place-items: center; color: var(--m-ink-2); cursor: pointer; padding: 0; }
.ib:hover { background: var(--m-hover); color: var(--m-ink); }
.ib svg { width: 14px; height: 14px; }

.head { display: flex; align-items: center; gap: 8px; margin: 6px 0 6px; padding: 5px 6px; border-radius: 8px; border: 0; background: none; width: 100%; font: 600 13px var(--ui); color: var(--m-ink); text-align: left; }
.head.menu { cursor: pointer; } .head.menu:hover { background: var(--m-hover); }
.head .sq { width: 18px; height: 18px; border-radius: 5px; background: var(--c); flex: none; }
.head .chev { margin-left: auto; color: var(--m-ink-3); font-size: 10px; }
.seg { display: flex; background: var(--m-hover); border-radius: 8px; padding: 2px; gap: 2px; margin: 6px 0 6px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 6px; padding: 4px 0; font: 11.5px var(--ui); color: var(--m-ink-2); cursor: pointer; }
.seg button.on { background: var(--m-sel); color: var(--m-ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.url { margin: 2px 0 8px; height: 30px; border-radius: 8px; background: var(--m-field); display: flex; align-items: center; gap: 7px; padding: 0 9px; font-size: 12px; color: var(--m-ink-2); }
.favs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px; }
.fav { height: 38px; border-radius: 9px; background: var(--m-hover); display: grid; place-items: center; }
.fav.on { background: var(--m-sel); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.list { overflow-y: auto; min-height: 0; flex: 1; }
.sec { font-size: 10.5px; font-weight: 600; color: var(--m-ink-3); padding: 9px 6px 3px; display: flex; align-items: center; gap: 6px; letter-spacing: .02em; }
.sec .grow { flex: 1; height: 1px; background: var(--m-rule); }
.sec .act { font-weight: 500; color: var(--m-ink-3); }
.row { display: flex; align-items: center; gap: 8px; min-height: 29px; padding: 0 6px 0 8px; border-radius: 8px; font-size: 12.5px; user-select: none; }
.row:hover { background: var(--m-hover); }
.row.on { background: var(--m-sel); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .m { font-size: 11px; color: var(--m-ink-3); font-variant-numeric: tabular-nums; }
.row.child { padding-left: 24px; }
.row .caret { width: 10px; color: var(--m-ink-3); font-size: 9px; }
.gl { width: 16px; height: 16px; border-radius: 4px; flex: none; display: grid; place-items: center; color: #fff; font-size: 9.5px; font-weight: 700; background: var(--f); }
.fav .gl { width: 20px; height: 20px; border-radius: 5px; }
.ring { width: 16px; height: 16px; flex: none; border-radius: 50%; background: conic-gradient(var(--f) calc(var(--p) * 1%), var(--m-rule) 0); -webkit-mask: radial-gradient(circle, transparent 4.5px, #000 5px); mask: radial-gradient(circle, transparent 4.5px, #000 5px); }
.due { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; background: var(--m-hover); color: var(--m-ink-2); }
.due.late { background: color-mix(in srgb, #d0453a 18%, transparent); color: #c0392b; }
.upcard { margin: 2px 0 4px; padding: 7px 8px; border-radius: 9px; background: var(--m-sel); box-shadow: 0 1px 2px rgba(0,0,0,.06); font-size: 12px; display: grid; gap: 3px; }
.upcard .r { display: flex; gap: 7px; align-items: center; }
.upcard .n { font-weight: 600; flex: 1; }
.upcard .s { color: var(--m-ink-2); font-size: 11px; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px 4px 2px; }
.fchip { font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: var(--m-hover); color: var(--m-ink-2); }
.fchip.on { background: var(--m-sel); color: var(--m-ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.foot { border-top: 1px solid var(--m-rule); padding: 7px 4px 0; font-size: 11.5px; color: var(--m-ink-2); display: grid; gap: 5px; }
.foot .r { display: flex; gap: 7px; align-items: center; }
.foot b { color: var(--m-ink); font-weight: 600; }
.foot .tm { margin-left: auto; font-variant-numeric: tabular-nums; }
.chk { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--m-ink-3); flex: none; }

.pop { position: absolute; left: 8px; top: 58px; width: 290px; max-height: 560px; overflow: auto; z-index: 5; border-radius: 12px; background: var(--menu); box-shadow: var(--shadow); padding: 6px; border: 1px solid var(--m-rule); }

.content { flex: 1; min-width: 0; padding: 8px 8px 8px 0; display: grid; gap: 6px; grid-template-columns: 1.25fr 1fr; grid-template-rows: 1fr 1fr; }
.tile { min-width: 0; min-height: 0; border-radius: 10px; overflow: hidden; background: var(--pagebg); box-shadow: 0 0 0 1px var(--m-rule), 0 1px 3px rgba(0,0,0,.08); display: flex; flex-direction: column; }
.tile.big { grid-row: span 2; }
.tile.focus { box-shadow: 0 0 0 2px var(--c), 0 1px 3px rgba(0,0,0,.08); }
.tile .nav { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--m-ink-2); flex: none; }
.tile .nav b { color: var(--m-ink); }
.tile .b { padding: 12px 14px; display: grid; gap: 8px; align-content: start; font-size: 12px; }
.tile h2 { font-size: 15px; margin: 0; }
.ln { height: 7px; border-radius: 4px; background: var(--line); }
.task { display: flex; gap: 8px; align-items: center; }

.panel { display: grid; gap: 12px; align-content: start; }
.q { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.q h3 { margin: 0; font-size: 12.5px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.q h3 span { font: 11px var(--mono); color: var(--ink-3); }
.q p { margin: 0; font-size: 11.5px; color: var(--ink-2); line-height: 1.45; }
.opts { display: grid; gap: 4px; }
.opt { display: grid; grid-template-columns: 16px 1fr; gap: 6px; align-items: start; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 12px; line-height: 1.35; }
.opt:hover { background: var(--chip); }
.opt input { margin: 2px 0 0; accent-color: var(--accent); }
.opt small { display: block; color: var(--ink-2); font-size: 11px; }
.opt:has(input:checked) { background: var(--pick); }
.opt:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.copy { display: flex; gap: 8px; align-items: center; }
.copy button { font: 12px var(--ui); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--chip); color: var(--ink); cursor: pointer; }
.copy button:focus-visible { outline: 2px solid var(--accent); }
.copy span { font-size: 11.5px; color: var(--ink-2); }
pre#summary { margin: 0; font: 11px/1.5 var(--mono); white-space: pre-wrap; color: var(--ink-2); background: var(--chip); border-radius: 8px; padding: 8px; overflow-x: auto; }
@media (max-width: 640px) { .stage { height: 640px; } .content { display: none; } .side { width: 100%; } }
</style>

<div class="wrap">
  <div style="min-width:0">
    <h1>A project window in the frame</h1>
    <p class="sub">The space's sidebar over a project's board, for the Folio project. The header and tab row are gone, as in a space. Each control on the right is one open question; the window follows your picks. Click the project name or the toggle where the pick puts one.</p>
    <div class="stage">
      <div class="win">
        <div class="side" id="side"></div>
        <div class="content" id="content"></div>
      </div>
    </div>
  </div>
  <div class="panel" id="panel"></div>
</div>

<script>
const Q = [
  { id: 'others', n: 'Q1', title: 'Other projects', why: 'Today’s project list (with Up Next and its filters) has no room beside the frame. The dock and ⌥Tab already reach every project.',
    opts: [
      ['switcher', 'The project name is a menu', 'Click it: Up Next, then every project, as the list today. The sidebar stays this project.'],
      ['mode', 'A Project / All Projects toggle', 'The sidebar swaps between this project’s cards and the full list.'],
      ['dock', 'The dock and ⌥Tab only', 'The sidebar is only this project. All Projects… (⇧⌘P) opens the list in a window of its own.'],
    ]},
  { id: 'upnext', n: 'Q2', title: 'Up Next', why: 'Projects due soon. It sits at the top of today’s list.',
    opts: [
      ['withlist', 'With the project list', 'Wherever Q1 puts the list, Up Next leads it.'],
      ['always', 'In every project’s sidebar', 'Two or three rows under the favourites, whatever project you’re in.'],
      ['dockonly', 'Dock and menu bar only', 'A dot on overdue marks; the list lives in the menu bar item.'],
    ]},
  { id: 'filters', n: 'Q3', title: 'List filters', why: 'Active / Archived / All, Projects / Areas, grouped by Due or Domain.',
    opts: [
      ['chips', 'Chips over the list', 'Shown wherever the list is shown.'],
      ['menu', 'View menu only', 'The list reads as it’s set; change it from View ▸ Projects.'],
    ]},
  { id: 'favs', n: 'Q4', title: 'Favourites in a project', why: 'A space has a row of icon tiles for its most-used cards.',
    opts: [
      ['yes', 'Yes, as a space', 'Up to 8 cards as icon tiles under the name.'],
      ['no', 'No', 'Pinned does that job in a project.'],
    ]},
  { id: 'loose', n: 'Q5', title: 'Cards that aren’t pinned', why: 'In a space they are Today, cleared and archived. A project board keeps cards for good.',
    opts: [
      ['cards', 'All of them, by frame', 'A Cards section: every unpinned card on the board, frames as folders. Nothing archives.'],
      ['today', 'Today, as a space', 'Cards opened this week (⌘T, links); older ones stay on the board but leave the list.'],
      ['none', 'None listed', 'Pinned and workspaces only; Board shows the rest.'],
    ]},
  { id: 'notes', n: 'Q6', title: 'Notes', why: 'A project’s notes file. In the tab row today it’s the first tab.',
    opts: [
      ['top', 'A row above Board', 'Notes, then Board: the project’s two fixed places.'],
      ['pinned', 'First among Pinned', 'A card like the others, pinned and unpinnable-proof.'],
    ]},
  { id: 'foot', n: 'Q7', title: 'The sidebar’s foot', why: 'A space shows its colour and name there. A project has a session and a focused task.',
    opts: [
      ['session', 'Focused task and session', 'The task you’re on, its tick, and the session’s time.'],
      ['name', 'Name and colour, as a space', 'Tasks stay in the project card and the companion panel.'],
    ]},
];
const pick = { others: 'switcher', upnext: 'withlist', filters: 'chips', favs: 'no', loose: 'cards', notes: 'top', foot: 'session' };
let popOpen = false, mode = 'project';
try { Object.assign(pick, JSON.parse(localStorage.getItem('pf-pick') || '{}')); } catch (e) {}

const gl = (t, f) => `<span class="gl" style="--f:${f}">${t}</span>`;
const CARDS = {
  pr: ['GitHub — #412 Frame for projects', gl('G', '#24292f')],
  ad: ['NSSplitViewController', gl('A', '#6b7280')],
  fg: ['Figma — Frame v3', gl('F', '#a259ff')],
  sp: ['docs/spaces.md', gl('M', '#3b82f6')],
  tf: ['TestFlight', gl('T', '#0ea5e9')],
  ar: ['Arc — sidebar teardown', gl('A', '#e5484d')],
  hn: ['HN thread on Arc', gl('Y', '#f97316')],
};
const PROJECTS = [
  ['Folio', '#3f7d58', 64, 'Fri', false, true],
  ['Kitchen renovation', '#c2793b', 30, 'Tue', true],
  ['Tax 2026', '#5b6bd6', 80, 'Nov 12'],
  ['Talk: native Mac apps', '#b4508c', 15, 'Dec 3'],
  ['Garden', '#5f8f3a', null, null],
  ['Reading', '#8a6d4b', null, null],
];

function row(icon, text, extra = '', cls = '') { return `<div class="row ${cls}">${icon}<span class="t">${text}</span>${extra}</div>`; }
function card(id, cls = '') { const [t, i] = CARDS[id]; return row(i, t, '', cls); }

function projectList(withUp) {
  let h = '';
  if (withUp && pick.upnext === 'withlist') h += upNext();
  if (pick.filters === 'chips') h += `<div class="filters"><span class="fchip on">Active</span><span class="fchip">Archived</span><span class="fchip">All</span><span class="fchip on">By due</span><span class="fchip">By domain</span></div>`;
  h += `<div class="sec">This week<span class="grow"></span></div>`;
  PROJECTS.slice(0, 2).forEach(p => h += row(`<span class="ring" style="--f:${p[1]};--p:${p[2]}"></span>`, p[0], `<span class="due ${p[4] ? 'late' : ''}">${p[3]}</span>`, p[5] ? 'on' : ''));
  h += `<div class="sec">Later<span class="grow"></span></div>`;
  PROJECTS.slice(2, 4).forEach(p => h += row(`<span class="ring" style="--f:${p[1]};--p:${p[2]}"></span>`, p[0], `<span class="due">${p[3]}</span>`));
  h += `<div class="sec">Areas<span class="grow"></span></div>`;
  PROJECTS.slice(4).forEach(p => h += row(`<span class="gl" style="--f:${p[1]}"></span>`, p[0]));
  return h;
}
function upNext() {
  return `<div class="sec">Up next<span class="grow"></span></div>
    <div class="upcard"><div class="r"><span class="ring" style="--f:#c2793b;--p:30"></span><span class="n">Kitchen renovation</span><span class="due late">Tue</span></div><div class="s">Order the worktop · 3 of 10</div></div>
    <div class="upcard"><div class="r"><span class="ring" style="--f:#3f7d58;--p:64"></span><span class="n">Folio</span><span class="due">Fri</span></div><div class="s">Frame for projects · 9 of 14</div></div>`;
}
function projectSide() {
  let h = '';
  if (pick.favs === 'yes') h += `<div class="favs"><div class="fav on">${CARDS.pr[1]}</div><div class="fav">${CARDS.fg[1]}</div><div class="fav">${CARDS.tf[1]}</div><div class="fav">${CARDS.sp[1]}</div></div>`;
  h += `<div class="list">`;
  if (pick.upnext === 'always') h += upNext();
  if (pick.notes === 'top') h += row(gl('¶', '#7c6f5b'), 'Notes') ;
  h += row(gl('▦', '#6b7280'), 'Board', '<span class="m">23</span>');
  h += `<div class="sec">Pinned<span class="grow"></span></div>`;
  if (pick.notes === 'pinned') h += row(gl('¶', '#7c6f5b'), 'Notes');
  h += row(`<span style="display:flex;gap:2px">${CARDS.pr[1]}${CARDS.ad[1]}${CARDS.sp[1]}</span>`, 'Release', '', 'on');
  h += row(`<span style="display:flex;gap:2px">${CARDS.fg[1]}${CARDS.ar[1]}</span>`, 'Research');
  if (pick.favs === 'no') h += card('tf');
  h += card('fg');
  if (pick.loose === 'cards') {
    h += `<div class="sec">Cards<span class="grow"></span><span class="act">New</span></div>`;
    h += row('<span class="caret">▾</span>', 'Sidebar research') + card('ar', 'child') + card('hn', 'child');
    h += card('ad') + card('sp');
  } else if (pick.loose === 'today') {
    h += `<div class="sec">Today<span class="grow"></span><span class="act">Clear</span></div>`;
    h += row(gl('+', '#9196a1'), '<span style="color:var(--m-ink-2)">New Tab</span>') + card('hn') + card('ar');
  }
  h += `</div>`;
  return h;
}
function foot() {
  if (pick.foot === 'session') return `<div class="foot"><div class="r"><span class="chk"></span><b style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Frame for projects: the sidebar</b></div><div class="r"><span>Session · Folio</span><span class="tm">1:24</span></div></div>`;
  return `<div class="foot"><div class="r"><span class="gl" style="--f:var(--c)"></span><b>Folio</b><span class="tm">⌘S</span></div></div>`;
}
function side() {
  const lights = `<div class="lights"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="grow"></span><button class="ib" aria-label="Fold the sidebar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg></button></div>`;
  let h = lights;
  const head = (menu) => `<button class="head ${menu ? 'menu' : ''}" id="phead" ${menu ? 'aria-haspopup="menu" aria-expanded="' + popOpen + '"' : 'tabindex="-1"'}><span class="sq"></span>Folio${menu ? '<span class="chev">▾</span>' : ''}</button>`;
  if (pick.others === 'mode') {
    h += `<div class="seg" role="tablist"><button class="${mode === 'project' ? 'on' : ''}" data-mode="project">Folio</button><button class="${mode === 'all' ? 'on' : ''}" data-mode="all">All Projects</button></div>`;
    if (mode === 'all') return h + `<div class="list">${projectList(true)}</div>` + foot();
  } else h += head(pick.others === 'switcher');
  h += `<div class="url">github.com/shanberg/project-manager/pull/412</div>`;
  h += projectSide() + foot();
  if (pick.others === 'switcher' && popOpen) h += `<div class="pop" role="menu">${projectList(true)}<div class="sec"><span class="grow"></span></div>${row('', '<span style="color:var(--m-ink-2)">All Projects…</span>', '<span class="m">⇧⌘P</span>')}</div>`;
  return h;
}
function content() {
  return `<div class="tile big focus"><div class="nav"><b>github.com</b> shanberg/project-manager · Pull requests</div><div class="b"><h2>Frame for projects #412</h2><div class="ln" style="width:70%"></div><div class="ln" style="width:90%"></div><div class="ln" style="width:55%"></div><div class="ln" style="width:80%"></div></div></div>
  <div class="tile"><div class="nav"><b>developer.apple.com</b> NSSplitViewController</div><div class="b"><div class="ln" style="width:60%"></div><div class="ln" style="width:85%"></div><div class="ln" style="width:40%"></div></div></div>
  <div class="tile"><div class="nav"><b>spaces.md</b></div><div class="b"><div class="task"><span class="chk"></span>Decide the project list’s place</div><div class="task"><span class="chk"></span>Notes as a row</div><div class="ln" style="width:70%"></div></div></div>`;
}
function panel() {
  let h = '';
  for (const q of Q) {
    h += `<fieldset class="q" style="margin:0"><legend style="padding:0"><h3><span>${q.n}</span>${q.title}</h3></legend><p>${q.why}</p><div class="opts">`;
    for (const [v, l, d] of q.opts) h += `<label class="opt"><input type="radio" name="${q.id}" id="${q.id}-${v}" value="${v}" ${pick[q.id] === v ? 'checked' : ''}><span>${l}<small>${d}</small></span></label>`;
    h += `</div></fieldset>`;
  }
  h += `<div class="q"><h3>Your picks</h3><pre id="summary"></pre><div class="copy"><button id="copy">Copy picks</button><span id="copied" aria-live="polite"></span></div></div>`;
  return h;
}
function summary() {
  return Q.map(q => `${q.n} ${q.title}: ${q.opts.find(o => o[0] === pick[q.id])[1]}`).join('\n');
}
function render() {
  document.getElementById('side').innerHTML = side();
  document.getElementById('content').innerHTML = content();
  const s = document.getElementById('summary'); if (s) s.textContent = summary();
}
document.getElementById('panel').innerHTML = panel();
document.getElementById('panel').addEventListener('change', e => {
  if (e.target.name) { pick[e.target.name] = e.target.value; popOpen = false; mode = 'project';
    try { localStorage.setItem('pf-pick', JSON.stringify(pick)); } catch (err) {} render(); }
});
document.getElementById('side').addEventListener('click', e => {
  const m = e.target.closest('[data-mode]'); if (m) { mode = m.dataset.mode; return render(); }
  if (e.target.closest('#phead') && pick.others === 'switcher') { popOpen = !popOpen; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && popOpen) { popOpen = false; render(); } });
document.getElementById('panel').addEventListener('click', e => {
  if (e.target.id !== 'copy') return;
  const text = summary(), out = document.getElementById('copied');
  navigator.clipboard.writeText(text).then(() => out.textContent = 'Copied', () => {
    const r = document.createRange(); r.selectNodeContents(document.getElementById('summary'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); out.textContent = 'Selected: press ⌘C';
  });
});
render();
</script>
