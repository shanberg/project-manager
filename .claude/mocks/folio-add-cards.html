<title>Folio Sidebar Add</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

  --wall-a: #1d2944; --wall-b: #3a2742; --wall-c: #4a3326;
  --shadow: 0 10px 34px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --m-ink: #f2f2f4; --m-ink-2: rgba(242,242,244,.64); --m-ink-3: rgba(242,242,244,.4);
  --m-rule: rgba(255,255,255,.1); --m-hover: rgba(255,255,255,.07); --m-sel: rgba(255,255,255,.14);
  --m-field: rgba(0,0,0,.25); --win: rgba(34,35,40,.96); --pagebg: #1f2025; --line: #2e3036; --menu: rgba(44,45,50,.98);
  --hl: #3d74e0; --hl-ink: #ffffff; --new: rgba(107,156,255,.22);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --page: #17181c; --panel: #212329; --ink: #e9eaee; --ink-2: #a3a7b2; --ink-3: #6f7480; --rule: #33363e;
  --accent: #6b9cff; --chip: #2b2e36; --pick: rgba(107,156,255,.2);
  --wall-a: #1d2944; --wall-b: #3a2742; --wall-c: #4a3326;
  --shadow: 0 10px 34px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --m-ink: #f2f2f4; --m-ink-2: rgba(242,242,244,.64); --m-ink-3: rgba(242,242,244,.4);
  --m-rule: rgba(255,255,255,.1); --m-hover: rgba(255,255,255,.07); --m-sel: rgba(255,255,255,.14);
  --m-field: rgba(0,0,0,.25); --win: rgba(34,35,40,.96); --pagebg: #1f2025; --line: #2e3036; --menu: rgba(44,45,50,.98);
  --hl: #3d74e0; --hl-ink: #ffffff; --new: rgba(107,156,255,.22);

}

  max-width: 1420px; margin: 0 auto; }

.menu { min-width: 228px; }
.mi { display: flex; align-items: center; gap: 8px; padding: 3px 8px; min-height: 22px; border-radius: 5px; cursor: default; white-space: nowrap; }
.mi:hover, .mi.hov { background: var(--hl); color: var(--hl-ink); }
.mi:hover .k, .mi.hov .k, .mi:hover .sub2, .mi.hov .sub2 { color: inherit; opacity: .8; }
.mi .k { margin-left: auto; color: var(--m-ink-3); font-size: 11.5px; padding-left: 14px; }

.gal { width: 300px; padding: 8px; display: grid; gap: 8px; }
.gal .mh { padding: 0 2px; }

.gt { border: 0; background: var(--m-hover); border-radius: 9px; padding: 8px 2px 6px; display: grid; justify-items: center; gap: 5px; font: 11px var(--ui); color: var(--m-ink); cursor: pointer; }

.gt .gl { width: 24px; height: 24px; border-radius: 6px; font-size: 12px; }

.sugg { left: 8px; right: 8px; width: auto; }
.toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--menu); color: var(--m-ink); border: 1px solid var(--m-rule); box-shadow: var(--shadow); border-radius: 9px; padding: 7px 12px; font-size: 12px; z-index: 7; max-width: 80%; text-align: center; }

.tile.fresh { animation: tfresh 1.2s ease-out; }

@media (prefers-reduced-motion: reduce) { .tile.fresh { animation: none; } }
.tile .nav { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--m-ink-2); flex: none; white-space: nowrap; overflow: hidden; }
.tile .nav b { color: var(--m-ink); }
.tile .b { padding: 12px 14px; display: grid; gap: 8px; align-content: start; font-size: 12px; min-height: 0; overflow: hidden; }
.tile h2 { font-size: 15px; margin: 0; }
.ln { height: 7px; border-radius: 4px; background: var(--line); }
.frow { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.frow .d { margin-left: auto; color: var(--m-ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.trow { display: grid; grid-template-columns: 96px 1fr 44px; gap: 8px; align-items: center; font-size: 11.5px; }
.trow .bar2 { height: 9px; border-radius: 3px; background: var(--f); }
.trow .h { text-align: right; font-variant-numeric: tabular-nums; color: var(--m-ink-2); }
.seat { display: grid; gap: 3px; padding: 6px 8px; border-radius: 7px; background: var(--m-hover); font-size: 11.5px; }

.panel { display: grid; gap: 12px; align-content: start; }
.q { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; display: grid; gap: 8px; margin: 0; }
.q h3 { margin: 0; font-size: 12.5px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.q h3 span { font: 11px var(--mono); color: var(--ink-3); }

.opt:hover { background: var(--chip); }

.chips { display: flex; gap: 4px; padding: 4px 4px 6px; border-bottom: 1px solid var(--m-rule); margin-bottom: 4px; }

<div class="wrap">
  <div style="min-width:0">
    <h1>Adding a folder, a Time view or any card from the sidebar · decided</h1>
    <p class="sub">Decided after two rounds; recorded in docs/spaces.md (Adding cards from the sidebar). The controls still switch the mock. Click the field (⌘T / ⌘L in the app), type “time”, “folder”, “+day” or “~/Do”, use ↑↓ and Return.</p>
    <div class="bar">
      <span>Window</span>
      <div class="tog" role="group" aria-label="Window"><button id="w-space" data-win="space">Space · Home</button><button id="w-project" data-win="project">Project · Folio</button></div>
      <button class="reset" id="reset">Reset the window</button>
      <span class="hint" id="doorhint"></span>
    </div>

      <div class="win" id="win">

<script>
/* Round 1, decided 2026-11-05. */
const DECIDED = [
  ['The door', 'The address field (⌘T / ⌘L): type a kind’s name. New Tab stays the web row.'],
  ['Right-click the sidebar', 'The add list, as a menu.'],
  ['The list’s shape', 'File ▸ New Card’s menu, views in a submenu (folder’s +, right-click).'],
  ['Where it shows', 'In the tile you’re in.'],
  ['Where it’s listed', 'Where you asked: a folder’s + (on hover) adds into that frame.'],
  ['Choosing the folder', 'Recent folders first, then Choose….'],
  ['“Folder”', 'Keep both: frames are sidebar folders, New Folder… is a Finder folder.'],
  ['The empty field', 'Lists the kinds under “Make a card”, below recent pages.'],
  ['Return on a name', 'The whole name makes the card, filled in as you type; an address fills in first.'],
  ['Paths', '~ or / lists folders and files.'],
  ['“folder”', 'Recent folders are the rows; one Return.'],
  ['From the field', 'Top of Today / Cards.'],
];
const Q = [
  { id: 'empty', n: 'Q8', title: 'The empty field', why: '⌘T or a click opens the field with nothing typed. Today it lists nothing until you type.',
    opts: [
      ['kinds', 'Lists the kinds', 'Every kind under “Make a card”, below recent pages. Taller, but you see what’s there.'],
      ['chips', 'A row of kind icons', 'One line of icons over the suggestions (Web, Text, File, Folder, Time, Day, …); click one, or type its name.'],
      ['hint', 'A hint only', 'The placeholder says “Search, address, or a card: time, folder…”. Kinds appear once you type.'],
    ]},
  { id: 'enter', n: 'Q9', title: 'Return on a kind’s name', why: 'Words that aren’t an address are a search today. “time” could be either.',
    opts: [
      ['exact', 'The whole name makes the card', '“time” ↩ is a Time view, filled in as you type (“ti” → time). “time zones” ↩ searches.'],
      ['search', 'Search stays first', 'Kinds are rows under the search; ↓ ↩ picks one. Nothing about Return changes.'],
      ['prefix', 'Only after +', '“+time” ↩ makes the view; plain words search as today. A + typed alone lists every kind.'],
    ]},
  { id: 'paths', n: 'Q10', title: 'Typing a path', why: 'A folder or file is a place on disk: ~ or / could find it directly.',
    opts: [
      ['yes', 'Paths list folders and files', '“~/Do” lists Documents, Downloads; ↩ makes a folder or file card. Tab goes into a folder.'],
      ['no', 'No paths', 'Folders come from the folder kind’s recents and Choose….'],
    ]},
  { id: 'fstep', n: 'Q11', title: 'Typing “folder”', why: 'Recent folders come first (Q6). How many steps to one?',
    opts: [
      ['inline', 'Recents are the rows', '“folder” lists Folder · project-manager, Folder · Downloads, …, Choose Folder…. One ↩.'],
      ['two', 'Then a second list', '“folder” ↩, then the list turns into recent folders. Two ↩.'],
    ]},
  { id: 'alands', n: 'Q12', title: 'Where a card from the field is listed', why: 'The field has no place of its own. A folder’s + already says where.',
    opts: [
      ['top', 'Top of Today / Cards', 'As ⌘T’s web cards.'],
      ['focused', 'Beside the card in front', 'Into the folder (or Pinned) of the card in the tile you’re in. Click a Recipes card, then make one.'],
    ]},
];
const DEFAULT = { door: 'address', ctx: 'yes', shape: 'menu', shows: 'here', lands: 'context', folder: 'recents', naming: 'keep',
  empty: 'kinds', enter: 'exact', paths: 'yes', fstep: 'inline', alands: 'top' };
const pick = { ...DEFAULT };
let note = '';
try { { const saved = JSON.parse(localStorage.getItem('fa-pick2') || '{}'); for (const q of Q) if (saved[q.id]) pick[q.id] = saved[q.id]; } note = localStorage.getItem('fa-note') || ''; } catch (e) {}
let win = 'space';
try { win = localStorage.getItem('fa-win') || 'space'; } catch (e) {}

const gl = (t, f) => `<span class="gl" style="--f:${f}">${t}</span>`;
const plain = t => `<span class="gl plain">${t}</span>`;
const FOLDER_SYM = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 4.5h4l1.3 1.5H14v6.5H2z"/></svg>';
const FRAME_SYM = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/></svg>';

/* Every kind CanvasAddCommand offers, with what its card looks like here. */
const KINDS = {
  web:     { menu: 'New Web Card…', tile: 'Web', g: gl('◎', '#2f6fe4'), group: 'cards', words: 'web page tab site url' },
  card:    { menu: 'New Card', tile: 'Text', g: gl('¶', '#8a7a62'), group: 'cards', words: 'card text note' },
  file:    { menu: 'New File…', tile: 'File', g: gl('▤', '#6b7280'), group: 'cards', words: 'file document' },
  folder:  { menu: 'New Folder…', tile: 'Folder', g: gl('▰', '#3b82f6'), group: 'cards', words: 'folder finder directory' },

    case 'time': {
      const rows = [['Folio', '#3f7d58', 92, '3:41'], ['Kitchen reno', '#c2793b', 38, '1:32'], ['Tax 2026', '#5b6bd6', 20, '0:48'], ['Away', '#9196a1', 9, '0:22']];
      return nav('Time', '· Today') + `<div class="b"><div style="font-size:11px;color:var(--m-ink-3)">6:23 counted · 0:22 away to answer</div>${rows.map(([n, f, w, hrs]) => `<div class="trow"><span>${n}</span><span class="bar2" style="--f:${f};width:${w}%"></span><span class="h">${hrs}</span></div>`).join('')}</div>`;
    }
    case 'day': return nav('Day', '· Today') + `<div class="b"><div class="seat"><b>9:10 · Folio</b>Sidebar: adding cards</div><div class="seat"><b>13:30 · Kitchen reno</b>Order the worktop</div></div>`;
    case 'card': return nav('Card') + `<div class="b"><span style="color:var(--m-ink-3)">Type…</span></div>`;
    case 'file': return nav(c.t) + `<div class="b"><h2>${c.t.replace(/^.*\//, '')}</h2>${lines([80, 60, 90, 45])}</div>`;
    case 'web': case 'private':
      if (c.t === 'New Tab' || c.t.startsWith('Private')) return nav(c.kind === 'private' ? 'Private' : 'New Tab') + `<div class="b"><span style="color:var(--m-ink-3)">The sidebar’s address field has the keys.</span></div>`;
      return nav(c.t.split(' — ')[0].toLowerCase().replace(/\s/g, '') + '.com', c.t.split(' — ')[1] || '') + `<div class="b"><h2>${c.t.split(' — ').pop()}</h2>${lines([70, 90, 55, 80, 62])}</div>`;
    default: return nav(KINDS[c.kind]?.tile || c.t, '· View') + `<div class="b">${lines([60, 80, 50])}</div>`;
  }
}
function content() {
  const n = S.tiles.length;
  const el = document.getElementById('content');
  el.style.gridTemplateColumns = n === 1 ? '1fr' : n === 2 ? '1.3fr 1fr' : n === 3 ? '1.2fr 1fr 1fr' : '1fr 1fr';
  el.style.gridTemplateRows = n === 4 ? '1fr 1fr' : '1fr';
  return S.tiles.map((id, i) => `<div class="tile ${i === S.focus ? 'focus' : ''} ${S.freshTile === i ? 'fresh' : ''}" data-tile="${i}">${tileBody(id)}</div>`).join('');
}

/* Panel. */
function panel() {
  let h = `<div class="q"><h3><span>R1–2</span>Decided</h3><dl class="dec">${DECIDED.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`;
  for (const q of Q) {
    h += `<fieldset class="q"><legend style="padding:0"><h3><span>${q.n}</span>${q.title}</h3></legend><p>${q.why}</p><div class="opts">`;
    for (const [v, l, d] of q.opts) h += `<label class="opt"><input type="radio" name="${q.id}" id="${q.id}-${v}" value="${v}" ${pick[q.id] === v ? 'checked' : ''}><span>${l}<small>${d}</small></span></label>`;
    h += `</div></fieldset>`;
  }
  h += `<div class="q"><h3>Your picks</h3><label for="note" style="font-size:11.5px;color:var(--ink-2)">Notes for the next round</label><textarea id="note" placeholder="What felt wrong, what’s missing…"></textarea><pre id="summary"></pre><div class="copy"><button id="copy">Copy picks</button><span id="copied" aria-live="polite"></span></div></div>`;
  return h;
}
function summary() {
  const lines = ['Round 2'].concat(Q.map(q => `${q.n} ${q.title}: ${q.opts.find(o => o[0] === pick[q.id])[1]}`));
  if (note.trim()) lines.push('', 'Note: ' + note.trim());
  return lines.join('\n');
}
function hint() {
  return { kinds: 'Try: click the address field, or type “time”, “folder”, “~/Do”.', chips: 'Try: click the address field; the icons make a card.', hint: 'Try: type “time” or “folder” in the address field.' }[pick.empty]
    + (pick.enter === 'prefix' ? ' (Q9: start with +)' : '') + ' Hover a folder for its +.';
}
function render() {
  document.getElementById('side').innerHTML = side();
  document.getElementById('content').innerHTML = content();
  const old = document.getElementById('popwrap'); if (old) old.remove();
  const wrap = document.createElement('div'); wrap.id = 'popwrap'; wrap.innerHTML = popupHTML() + (S.toast ? `<div class="toast" role="status">${S.toast}</div>` : '');
  document.getElementById('win').appendChild(wrap);
  const s = document.getElementById('summary'); if (s) s.textContent = summary();
  document.getElementById('doorhint').textContent = hint();
  document.getElementById('w-space').classList.toggle('on', win === 'space');
  document.getElementById('w-project').classList.toggle('on', win === 'project');
  document.getElementById('win').style.setProperty('--c', S.color);
  const a = document.getElementById('addr');
  if (a) { a.focus(); a.setSelectionRange(a.value.length, a.value.length); }
  S.fresh = null; S.freshTile = null;
}
function closePop() { S.popup = null; }
let toastTimer;
function toast(t) { S.toast = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ''; render(); }, 2600); }

function relPos(el) {
  const w = document.getElementById('win').getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: r.left - w.left, y: r.top - w.top, w: r.width, h: r.height, right: r.right - w.left, bottom: r.bottom - w.top };
}
function openAt(anchor, el, into, ctx) {
  const p = relPos(el);
  const winH = document.getElementById('win').clientHeight;
  let x = Math.min(p.x, 250 - 30), y = p.bottom + 4;
  if (anchor === 'title') x = Math.max(8, p.right - 228);
  if (anchor === 'addr') { S.popup = { anchor, y: p.bottom + 4 }; return render(); }
  const est = pick.shape === 'flat' ? 420 : pick.shape === 'gallery' ? 250 : 230;
  if (y + est > winH - 8) y = Math.max(8, winH - est - 8);
  S.popup = { anchor, x, y, into, ctx };
  render();
}

document.getElementById('side').addEventListener('click', e => {
  e.fromSide = true; // the window's own click handler below sees this event after the sidebar re-rendered
  const door = e.target.closest('[data-door]');
  if (door && door.dataset.door) {
    const d = door.dataset.door;
    if (S.popup && S.popup.anchor === d) { closePop(); return render(); }
    if (d === 'newrow') { if (pick.door === 'newrow') return openAt('newrow', door); return add('web'); }
    if (d === 'rule' || d === 'title') return openAt(d, door);
    if (d === 'addr') return openAt('addr', door);
    if (d.startsWith('f:')) { e.stopPropagation(); return openAt(d, door, d.slice(2)); }
  }
  if (S.popup && !e.target.closest('#addr')) { closePop(); render(); }
  const fold = e.target.closest('[data-fold]');
  if (fold) { const f = S.folders.find(x => x.id === fold.dataset.fold); f.open = !f.open; return render(); }
  const c = e.target.closest('[data-card]');
  if (c) { S.tiles[S.focus] = c.dataset.card; render(); }
});
document.getElementById('side').addEventListener('contextmenu', e => {
  const zone = e.target.closest('[data-ctx]');
  if (!zone || pick.ctx !== 'yes') return;
  e.preventDefault();
  const w = document.getElementById('win').getBoundingClientRect();
  const winH = document.getElementById('win').clientHeight;
  const est = pick.shape === 'flat' ? 420 : 230;
  S.popup = { anchor: 'ctx', ctx: true, x: Math.min(e.clientX - w.left, 30), y: Math.min(e.clientY - w.top, winH - est - 8) };
  render();
});
document.getElementById('win').addEventListener('mouseover', e => {
  const p = S.popup; if (!p) return;
  const sub = e.target.closest('[data-sub]'), fk = e.target.closest('.menu [data-kind="folder"]');
  const item = e.target.closest('#pop .mi');
  if (sub && p.sub !== 'views') { const r = relPos(sub); p.sub = 'views'; p.subX = Math.min(r.right + 2, document.getElementById('win').clientWidth - 240); p.subY = r.y - 5; return render(); }
  if (fk && pick.folder === 'recents' && p.sub !== 'folder') { const r = relPos(fk); p.sub = 'folder'; p.subX = Math.min(r.right + 2, document.getElementById('win').clientWidth - 260); p.subY = r.y - 5; return render(); }
  if (item && !sub && !fk && p.sub) { p.sub = null; p.subY = null; render(); }
});
document.getElementById('win').addEventListener('click', e => {
  if (e.fromSide) return;
  if (S.skipClick) { S.skipClick = false; return; }
  const k = e.target.closest('[data-kind]');
  if (k && e.target.closest('.pop')) {
    const into = k.dataset.into || (S.popup?.into) || null;
    if (k.dataset.kind === 'folder') {
      if (pick.folder === 'recents') {
        if (pick.shape === 'gallery' && e.target.closest('.gal')) { S.popup.galleryFolder = true; return render(); }
        if (S.popup?.anchor === 'addr') { S.popup.galleryFolder = true; return render(); }
        return; /* the submenu is open on hover */
      }
      return chooseFolder(into);
    }
    return add(k.dataset.kind, { into });
  }
  const f = e.target.closest('[data-folder]');
  if (f) {
    const into = f.dataset.into || null;
    if (!f.dataset.folder) { pick.folder = 'panel'; chooseFolder(into); pick.folder = 'recents'; return; }
    return add('folder', { into, name: f.dataset.folder });
  }
  if (e.target.closest('[data-galback]')) { S.popup.galleryFolder = false; return render(); }
  const t = e.target.closest('[data-tile]');
  if (t && !S.popup) { S.focus = +t.dataset.tile; render(); }
  if (S.popup && !e.target.closest('.pop') && !e.target.closest('#side')) { closePop(); render(); }
});
document.getElementById('side').addEventListener('input', e => {
  if (e.target.id !== 'addr') return;
  S.query = e.target.value; S.sel = null;
  const pop = document.getElementById('pop'); if (pop) pop.innerHTML = suggestions();
  // Filled in after the caret, as the real field fills in an address (CanvasAddressTextField).
  if (S.fill && !/^delete/.test(e.inputType || '')) { const n = S.query.length; e.target.value = S.query + S.fill; e.target.setSelectionRange(n, n + S.fill.length); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.popup) { closePop(); S.query = ''; S.sel = null; render(); }
  if (e.target.id !== 'addr' || !S.list) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const n = S.list.length; if (!n) return;
    S.sel = S.sel == null ? (e.key === 'ArrowDown' ? (S.query.trim() ? 1 : 0) : n - 1) : Math.min(Math.max(S.sel + (e.key === 'ArrowDown' ? 1 : -1), 0), n - 1);
    document.getElementById('pop').innerHTML = suggestions();
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (S.fill) { S.query = e.target.value; document.getElementById('pop').innerHTML = suggestions(); }
    const x = S.list[S.sel ?? 0];
    if (x && (S.query.trim() || S.sel != null)) doRow(x); else if (!S.query.trim()) { closePop(); add('web', { into: pick.alands === 'focused' ? focusedPlace() : null }); }
  }
});
document.getElementById('win').addEventListener('mousedown', e => {
  if (e.target.closest('#pop [data-row], #pop [data-chip]')) S.skipClick = true; // its click lands on a re-rendered list
  // Rows and chips act on press so the field keeps focus, as the real suggestion panel does.
  const r = e.target.closest('#pop [data-row]');
  if (r && S.list) { e.preventDefault(); return doRow(S.list[+r.dataset.row]); }
  const c = e.target.closest('#pop [data-chip]');
  if (c) {
    e.preventDefault();
    if (c.dataset.chip === 'more') { const y = S.popup.y; S.popup = { anchor: 'ctx', ctx: true, x: 8, y }; return render(); }
    const k = c.dataset.chip, into = pick.alands === 'focused' ? focusedPlace() : null;
    if (k === 'folder') { S.popup.galleryFolder = true; return render(); }
    return add(k, { into });
  }
});
document.getElementById('panel').innerHTML = panel();
document.getElementById('note').value = note;
document.getElementById('panel').addEventListener('change', e => {
  if (!e.target.name) return;
  pick[e.target.name] = e.target.value; closePop();
  try { localStorage.setItem('fa-pick2', JSON.stringify(pick)); } catch (err) {}
  render();
});
document.getElementById('panel').addEventListener('input', e => {
  if (e.target.id !== 'note') return;
  note = e.target.value; try { localStorage.setItem('fa-note', note); } catch (err) {}
  document.getElementById('summary').textContent = summary();
});
document.getElementById('panel').addEventListener('click', e => {
  if (e.target.id !== 'copy') return;
  const text = summary(), out = document.getElementById('copied');
  navigator.clipboard.writeText(text).then(() => out.textContent = 'Copied', () => {
    const r = document.createRange(); r.selectNodeContents(document.getElementById('summary'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); out.textContent = 'Selected: press ⌘C';
  });
});
document.querySelector('.bar').addEventListener('click', e => {
  const w = e.target.closest('[data-win]');
  if (w) { win = w.dataset.win; try { localStorage.setItem('fa-win', win); } catch (err) {} reset(); return render(); }
  if (e.target.id === 'reset') { reset(); render(); }
});
render();
</script>
